import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

class CodeGen {

    def static variedResourceLocationImports(){ """
import net.minecraft.ResourceLocationException;
import net.minecraft.resources.ResourceLocation;
import org.jetbrains.annotations.NotNull;
import org.jetbrains.annotations.Nullable;
import java.util.Map;
import java.util.concurrent.ConcurrentHashMap;
"""
    }
// 定义你要注入的模板代码生成函数
    def static generateTemplateCode(String className, String typeName) {
        """
    public static final ${className} EMPTY = new ${className}("", "");
    public static final VariedResourceLocationBuilder<${typeName}, ${className}> BUILDER = ${className}::of;
    public static final VariedResourceLocationParser<${typeName}, ${className}> PARSER = ${className}::of;

    protected ${className}(String string, String string2, @Nullable ResourceLocation.Dummy dummy) {
        super(string, string2, dummy);
    }

    protected ${className}(String string, String string2) {
        super(string, string2);
    }

    protected ${className}(String string) {
        super(string);
    }

    protected ${className}(ResourceLocation resourceLocation) {
        super(resourceLocation.getNamespace(), resourceLocation.getPath());
    }

    public static final Map<ResourceLocation, ${className}> mapToReferredResourceLocation = new ConcurrentHashMap<>();
    public static final Map<String, Map<String, ${className}>> mapFromNamespaceAndPathToResourceLocation = new ConcurrentHashMap<>();

    static {
        mapFromNamespaceAndPathToResourceLocation.computeIfAbsent("", s -> new ConcurrentHashMap<>()).computeIfAbsent("", s -> EMPTY);
    }

    public static ${className} of(ResourceLocation resourceLocation) {
        return mapToReferredResourceLocation.computeIfAbsent(resourceLocation, ${className}::new);
    }

    public static ${className} of(String namespace, String path) {
        return mapFromNamespaceAndPathToResourceLocation
                .computeIfAbsent(namespace, n -> new ConcurrentHashMap<>())
                .computeIfAbsent(path, p -> new ${className}(namespace, path));
    }

    public static ${className} of(String namespaceAndPath) {
        if (namespaceAndPath.isEmpty()) {
            return of("", "");
        }
        var split = namespaceAndPath.split(":");
        if (split.length != 2) {
            throw new IllegalArgumentException("Invalid namespace and path: " + namespaceAndPath);
        }
        return of(split[0], split[1]);
    }

    @Nullable
    public static ${className} tryParse(String string) {
        try {
            return new ${className}(string);
        } catch (ResourceLocationException var2) {
            return null;
        }
    }

    public static @NotNull ${className} ofExisting(String namespace, String path) {
        var innerMap = mapFromNamespaceAndPathToResourceLocation.get(namespace);
        if (innerMap == null) {
            return EMPTY;
        }
        return innerMap.getOrDefault(path, EMPTY);
    }

    public static @NotNull ${className} ofExisting(ResourceLocation resLoc) {
        return ofExisting(resLoc.getNamespace(), resLoc.getPath());
    }
""".trim()
    }
}

plugins {
    id 'dev.architectury.loom' version '1.11.458' apply false
    id 'architectury-plugin' version '3.4.162'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version

}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'
    apply plugin: 'com.github.johnrengelman.shadow' // Shadow 插件

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.


    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
        implementation 'it.unimi.dsi:fastutil:8.5.18'
        implementation 'org.jsoup:jsoup:1.17.2'
        implementation 'org.apache.commons:commons-rng-sampling:1.5'
        implementation 'org.apache.commons:commons-rng-simple:1.5'
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }
    tasks.named('shadowJar', ShadowJar) {
        archiveClassifier.set('') // 覆盖默认 jar
        from sourceSets.main.output
        configurations = [project.configurations.implementation]

        // relocate trove 避免冲突
//        relocate 'gnu.trove', 'opentc4.libs.gnu.trove'//yeah i used AI for this part without checking sorry
        relocate 'it.unimi.dsi.fastutil', 'opentc4.libs.it.unimi.dsi.fastutil'
        relocate 'org.jsoup', 'opentc4.libs.org.jsoup'//for research page parsing
        relocate 'org.apache.commons.rng', 'opentc4.libs.org.apache.commons.rng'
    }

    // 确保 remapJar 使用 shadowJar 的输出
    tasks.named('remapJar') {
        dependsOn tasks.named('shadowJar')
        archiveFile.set(tasks.named('shadowJar').get().archiveFile)
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }

    task preprocessResourceLocations {

        def sourceDir = file("src/main/codeGenTemplate/variedresourcelocations") // 你的目标包路径
        def outputDir = file("src/main/java/thaumcraft/common/lib/resourcelocations")
        if (sourceDir.exists()) {
            inputs.dir(sourceDir)
        }
        outputs.dir(outputDir)

        doLast {
            if (!sourceDir.exists()) {
                return // 如果当前模块没有这个目录（比如纯 fabric 模块），直接跳过
            }

            // 正则匹配形如: //#include VariedResourceLocationSource("ClassName", "TypeName")
            def pattern = ~/\/\/#include VariedResourceLocationSource\("([^"]+)",\s*"([^"]+)"\)/
            def importPattern = ~/\/\/#include VariedResourceLocationImports/

            sourceDir.eachFileRecurse { file ->
                if (file.file && file.name.endsWith(".java")) {
                    def content = file.text
                    def matcher = pattern.matcher(content)

                    def relativePath = sourceDir.toPath().relativize(file.toPath())
                    def outFile = new File(outputDir, relativePath.toString())
                    outFile.parentFile.mkdirs()
                    if (matcher.find()) {
                        println "found"
                        // 提取参数
                        def className = matcher.group(1)
                        def typeName = matcher.group(2)

                        // 生成你要替换进去的模板代码（这里以你前面展示的带缓存逻辑的代码为例）
                        def generatedCode = CodeGen.generateTemplateCode(className, typeName)

                        // 把整行注释替换为生成的模板代码
                        def newContent = matcher.replaceAll(generatedCode)
                        def importPatternMatcher = importPattern.matcher(newContent)
                        if (importPatternMatcher.find()){
                            newContent = importPatternMatcher.replaceAll(CodeGen.variedResourceLocationImports())
                        }

                        // 保持原有的目录结构输出到 generated 目录
                        outFile.text = newContent

                        println "Preprocessed: ${file.name} -> Class: ${className}, Type: ${typeName}"
                    }
                    else {
//                        // 如果没有匹配的注释，直接复制原文件
//                        def relativePath = sourceDir.toPath().relativize(file.toPath())
//                        def outFile = new File(outputDir, relativePath.toString())
//                        outFile.parentFile.mkdirs()
                        outFile.text = file.text
                    }
                }
            }
        }
    }
//    sourceSets.main.java.srcDir file("$rootDir/generated/sources/preprocessor/src/main/java")
    tasks.named('compileJava') {
        dependsOn "preprocessResourceLocations_${project.name}"
    }

//// 绑定编译任务：让编译 Java 之前先执行这个预处理，并把生成的代码加入源码集
//    compileJava.dependsOn preprocessResourceLocations
//    sourceSets.main.java.srcDirs += "$buildDir/generated/sources/preprocessor/java"
}